---
layout: default
---

<article class="post">
  <header class="post-header">
    <a href="/blog" class="back-link">← All posts</a>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
